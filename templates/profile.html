{% extends "base.html" %}

{% block title %}
My Profile - Student Study Manager
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-person-circle fs-1 text-primary"></i>

                    <h3 class="fw-bold mt-2">
                        My Profile
                    </h3>

                    <p class="text-muted">
                        Your account information
                    </p>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Name
                    </label>

                    <div class="form-control">
                        {{ user.name }}
                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Email
                    </label>

                    <div class="form-control">
                        {{ user.email }}
                    </div>

                </div>



                <div class="d-grid gap-2 mt-4">


                    <a href="{{ url_for('auth.edit_profile') }}" class="btn btn-outline-primary">
                        <i class="bi bi-person-gear"></i>
                        Edit Profile
                    </a>

                    <a href="{{ url_for('auth.change_password') }}" class="btn btn-primary">
                        <i class="bi bi-shield-lock"></i>
                        Change Password
                    </a>

                    <a href="{{ url_for('dashboard.dashboard_home') }}" class="btn btn-dark">
                        <i class="bi bi-arrow-left"></i>
                        Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
