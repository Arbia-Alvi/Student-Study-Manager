{% extends "base.html" %}

{% block title %}
Change Password - Student Study Manager
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-shield-lock fs-1 text-primary"></i>

                    <h3 class="fw-bold mt-2">
                        Change Password
                    </h3>

                    <p class="text-muted">
                        Update your account password securely.
                    </p>

                </div>


                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Current Password
                        </label>

                        <input
                            type="password"
                            name="current_password"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            New Password
                        </label>

                        <input
                            type="password"
                            name="new_password"
                            class="form-control"
                            minlength="6"
                            required
                        >

                        <small class="text-muted">
                            Password must be at least 6 characters.
                        </small>

                    </div>


                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            <i class="bi bi-check-circle"></i>
                            Change Password
                        </button>

                        <a
                            href="{{ url_for('auth.profile') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
