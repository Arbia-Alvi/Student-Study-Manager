{% extends "base.html" %}

{% block title %}
Edit Subject - Student Study Manager
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <div
                        class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                        style="width: 65px; height: 65px;"
                    >
                        <i class="bi bi-pencil-square fs-3"></i>
                    </div>

                    <h2 class="fw-bold mt-3">
                        Edit Subject
                    </h2>

                    <p class="text-muted">
                        Update your subject information.
                    </p>

                </div>


                <form method="POST">

                    <!-- Subject Name -->

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-book"></i>
                            Subject Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control form-control-lg"
                            value="{{ subject.name }}"
                            maxlength="100"
                            required
                        >

                    </div>


                    <!-- Description -->

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-card-text"></i>
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                            maxlength="500"
                            placeholder="Enter a short description..."
                        >{{ subject.description or "" }}</textarea>

                    </div>


                    <!-- Buttons -->

                    <div class="d-flex gap-2">

                        <a
                            href="/subjects"
                            class="btn btn-outline-secondary w-50"
                        >
                            <i class="bi bi-arrow-left"></i>
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-dark w-50"
                        >
                            <i class="bi bi-check-circle"></i>
                            Update Subject
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
