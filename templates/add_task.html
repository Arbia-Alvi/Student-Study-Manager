{% extends "base.html" %}

{% block title %}
Add Task - Student Study Manager
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-7">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4 p-md-5">

                <!-- Heading -->

                <div class="text-center mb-4">

                    <div
                        class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                        style="width: 65px; height: 65px;"
                    >
                        <i class="bi bi-check2-square fs-3"></i>
                    </div>

                    <h2 class="fw-bold mt-3">
                        Add New Task
                    </h2>

                    <p class="text-muted">
                        Create a task and keep your study work organized.
                    </p>

                </div>


                <form method="POST">

                    <!-- Task Title -->

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-pencil"></i>
                            Task Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control form-control-lg"
                            placeholder="Enter task title"
                            maxlength="200"
                            required
                        >

                    </div>


                    <!-- Description -->

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-card-text"></i>
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                            maxlength="500"
                            placeholder="Enter task description"
                        ></textarea>

                    </div>


                    <!-- Subject -->

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-book"></i>
                            Subject
                        </label>

                        <select
                            name="subject_id"
                            class="form-select form-select-lg"
                            required
                        >

                            <option value="">
                                Select Subject
                            </option>

                            {% for subject in subjects %}

                                <option value="{{ subject.id }}">
                                    {{ subject.name }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Priority + Due Date -->

                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label class="form-label fw-semibold">
                                <i class="bi bi-flag"></i>
                                Priority
                            </label>

                            <select
                                name="priority"
                                class="form-select form-select-lg"
                                required
                            >

                                <option value="Low">
                                    Low
                                </option>

                                <option value="Medium" selected>
                                    Medium
                                </option>

                                <option value="High">
                                    High
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6 mb-4">

                            <label class="form-label fw-semibold">
                                <i class="bi bi-calendar-event"></i>
                                Due Date
                            </label>

                            <input
                                type="date"
                                name="due_date"
                                class="form-control form-control-lg"
                            >

                        </div>

                    </div>


                    <!-- Buttons -->

                    <div class="d-flex gap-2">

                        <a
                            href="{{ url_for('tasks.task_list') }}"
                            class="btn btn-outline-secondary w-50"
                        >
                            <i class="bi bi-arrow-left"></i>
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-dark w-50"
                        >
                            <i class="bi bi-plus-circle"></i>
                            Add Task
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
